services:
  - type: web
    name: render7-email-relay
    env: node
    rootDir: email-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: EMAIL_RELAY_TOKEN
        sync: false          # defina no painel do Render
      - key: SMTP_USER
        value: comercial@render7.com.br
      - key: SMTP_PASS
        sync: false          # defina no painel do Render
      - key: SMTP_HOST
        value: smtp.kinghost.net
      - key: RELAY_PORT
        value: "3001"
